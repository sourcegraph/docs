name: Check redirects

# Reports redirects in src/data/redirects.ts that this PR breaks, compared with
# the merge base: destinations that no longer exist, #fragments whose heading
# was renamed, and new redirects that shadow an existing page, as a summary
# comment plus an inline suggested change on each fixable entry. Pre-existing
# broken redirects on the base branch are ignored. Fails the PR.

on:
    pull_request:

# A new push supersedes the run for the previous one
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    check-redirects:
        name: Broken redirects introduced by this PR
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: ./.github/actions/pr-check
              with:
                  script: dev/check-redirects.mjs
                  name: check-redirects
                  diff-paths: src/data/redirects.ts
                  baseline: true
                  dependency: github-slugger
                  fail-on-findings: true
