name: Check duplicated content

# Reports passages a pull request adds that say the same thing as a passage
# elsewhere under docs/, compared with the merge base, as a summary comment
# plus an inline comment on each added passage. Duplication already on the
# base branch is ignored. Advisory: never fails the PR.

on:
    pull_request:
        paths:
            - 'docs/**'
            - 'dev/check-duplicates.mjs'
            - 'dev/check-shared.mjs'
            - 'dev/check-report.sh'
            - '.github/actions/pr-check/action.yml'
            - '.github/workflows/check-duplicates.yml'

# A new push supersedes the run for the previous one
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    check-duplicates:
        name: Duplicated content introduced by this PR (advisory)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: ./.github/actions/pr-check
              with:
                  script: dev/check-duplicates.mjs
                  name: check-duplicates
                  diff-paths: docs
                  baseline: true
