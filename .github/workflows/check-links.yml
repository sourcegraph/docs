name: Check links

# Reports internal links and #anchors that this PR breaks, compared with the
# merge base, absolute links to this site, and external links on added lines
# that 404, as a summary comment plus an inline suggested change on each
# fixable finding. Pre-existing broken links on the base branch are ignored.
# Fails the PR.

on:
    pull_request:

# A new push supersedes the run for the previous one
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    check-links:
        name: Broken links introduced by this PR
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: ./.github/actions/pr-check
              with:
                  script: dev/check-links.mjs
                  name: check-links
                  arguments: --check-anchors --check-self-links
                  head-only-arguments: --check-external
                  baseline: true
                  dependency: github-slugger
                  fail-on-findings: true
