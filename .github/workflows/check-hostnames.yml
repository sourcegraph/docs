name: Example hostnames

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'dev/check-hostnames.mjs'
      - '.github/workflows/check-hostnames.yml'

permissions:
  contents: read

jobs:
  check-hostnames:
    name: Canonical example hostnames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: node dev/check-hostnames.mjs
