name: Check example hostnames

# Reports placeholder hostnames on lines added by a pull request that are not
# the recommended ones (dev/example-hostnames.json), as a summary comment plus
# an inline suggested change on each flagged line. Advisory: never fails the PR.

on:
    pull_request:
        paths:
            - 'docs/**'
            - 'dev/check-hostnames.mjs'
            - 'dev/check-shared.mjs'
            - 'dev/example-hostnames.json'
            - 'dev/check-report.sh'
            - '.github/actions/pr-check/action.yml'
            - '.github/workflows/check-hostnames.yml'

# A new push supersedes the run for the previous one
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    check-hostnames:
        name: Placeholder hostnames introduced by this PR (advisory)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: ./.github/actions/pr-check
              with:
                  script: dev/check-hostnames.mjs
                  name: check-hostnames
                  diff-paths: docs
