name: Check list style

# Reports list style issues (.markdownlint-cli2.jsonc) in the docs pages a
# pull request changes, compared with the merge base, as a summary comment plus
# an inline comment on each flagged line the PR adds, with a suggested change
# where the fix is mechanical. Issues already on the base branch are ignored.
# Advisory: never fails the PR.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'dev/check-markdownlint.mjs'
      - '.markdownlint-cli2.jsonc'
      - 'dev/check-shared.mjs'
      - 'dev/check-report.sh'
      - '.github/actions/pr-check/action.yml'
      - '.github/workflows/check-markdownlint.yml'

# A new push supersedes the run for the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check-markdownlint:
    name: List style issues introduced by this PR (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Node 24 is pre-cached on ubuntu-latest, avoiding the download
      # incurred by node-version: latest.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Install only markdownlint-cli2 instead of the site's full
      # dependency tree.
      - name: Install markdownlint-cli2
        run: npm install --global markdownlint-cli2@0.24

      - uses: ./.github/actions/pr-check
        with:
          script: dev/check-markdownlint.mjs
          name: check-markdownlint
          diff-paths: docs
          baseline: true
